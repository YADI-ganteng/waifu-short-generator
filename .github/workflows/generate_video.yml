name: 🎬 Generate YT Shorts

on:
  push:
    branches: [ main ]
    paths:
      - 'stories/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-shorts:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg
        pip install -r requirements.txt
    
    - name: Generate YT Shorts
      run: python video_generator.py
    
    - name: Upload YT Shorts
      uses: actions/upload-artifact@v4
      with:
        name: yt-shorts
        path: output/*.mp4
        retention-days: 7
