name: 🎬 Generate Video 360p

on:
  push:
    branches: [ main ]
    paths:
      - 'stories/**'
  workflow_dispatch:

jobs:
  generate-video:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg
        pip install -r requirements.txt
    - name: Generate Video
      run: python video_generator.py
    - name: Upload Videos
      uses: actions/upload-artifact@v4
      with:
        name: video-parts-360p
        path: output/*.mp4
        retention-days: 7
